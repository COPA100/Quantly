[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "quantly-engine"
version = "0.1.0"
description = "Quantly C++ analytics engine (pybind11) for the compute-heavy risk metrics"
requires-python = ">=3.11"

[tool.scikit-build]
# keep the cmake floor in one place
cmake.version = ">=3.15"
wheel.packages = ["src/engine"]
build-dir = "build/{wheel_tag}"
