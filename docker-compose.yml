services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantly}
      POSTGRES_DB: ${POSTGRES_DB:-quantly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantly}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # local stand-in for s3 on port 9000. it accepts any credentials and creates
  # the bucket the app expects on startup.
  s3:
    image: adobe/s3mock:5.2.3
    # the image runs as uid 1000, which cannot write to a fresh named volume
    user: root
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: quantly-portfolios
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3root
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9000:9090"
    volumes:
      - s3_data:/s3root

  # celery worker: consumes analysis jobs off redis, talks to postgres + s3
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      # the c++ engine sits outside the backend context
      additional_contexts:
        engine: ./engine
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      QUANTLY_DATABASE_URL: postgresql+psycopg://quantly:quantly@postgres:5432/quantly
      QUANTLY_REDIS_URL: redis://redis:6379/0
      QUANTLY_CELERY_BROKER_URL: redis://redis:6379/1
      QUANTLY_CELERY_RESULT_BACKEND: redis://redis:6379/2
      QUANTLY_S3_ENDPOINT_URL: http://s3:9090
      # sweeper threshold, lowered by the chaos run so stuck jobs recover quickly
      QUANTLY_STUCK_AFTER_SECONDS: ${QUANTLY_STUCK_AFTER_SECONDS:-900}
      QUANTLY_SWEEPER_INTERVAL_SECONDS: ${QUANTLY_SWEEPER_INTERVAL_SECONDS:-60}
      # observability is off unless QUANTLY_OTEL_ENABLED=true is set, see README
      QUANTLY_OTEL_ENABLED: ${QUANTLY_OTEL_ENABLED:-false}
      QUANTLY_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318
      # prefork children write metrics here, the parent serves them on :9100
      PROMETHEUS_MULTIPROC_DIR: /tmp/prom
    tmpfs:
      - /tmp/prom
    ports:
      - "9100:9100"

  # celery beat: schedules the outbox relay and the stuck-portfolio sweeper.
  # run exactly one of these, a second would only duplicate (harmless) sends.
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      additional_contexts:
        engine: ./engine
    command:
      - celery
      - -A
      - worker.celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    environment:
      QUANTLY_REDIS_URL: redis://redis:6379/0
      QUANTLY_CELERY_BROKER_URL: redis://redis:6379/1
      QUANTLY_CELERY_RESULT_BACKEND: redis://redis:6379/2
      QUANTLY_SWEEPER_INTERVAL_SECONDS: ${QUANTLY_SWEEPER_INTERVAL_SECONDS:-60}

  # ---- observability stack, off by default: docker compose --profile obs up ----
  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    profiles: ["obs"]
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v3.1.0
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  s3_data:
