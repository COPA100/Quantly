name: images

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/images.yml"
  # deploy.yml calls this once the ecr repositories exist
  workflow_call:
    inputs:
      push:
        description: push the built images to ecr
        type: boolean
        default: false

permissions:
  id-token: write # oidc token, exchanged for short-lived aws credentials
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # matches the terraform name prefix, repos are <prefix>-api and <prefix>-worker
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'quantly-dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: backend/Dockerfile
          - service: worker
            dockerfile: backend/Dockerfile.worker
    env:
      # prs only prove the images build. pushing happens from the deploy
      # workflow, since the ecr repos only exist while the stack is up.
      PUSH: ${{ inputs.push == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image name
        id: image
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "name=${{ steps.ecr.outputs.registry }}/$NAME_PREFIX-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$NAME_PREFIX-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      # the sha tag is what gets deployed, latest just tracks the newest build
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
