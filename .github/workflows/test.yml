name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements/dev.txt

      # fixed hypothesis seed so a red build reproduces locally
      - name: pytest with coverage
        working-directory: backend
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest --cov=api --cov=common --cov=worker --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
        run: pytest

      - name: pytest (queue depth lambda)
        working-directory: backend
        run: pytest ../infra/lambda
