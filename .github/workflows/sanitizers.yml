name: sanitizers

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/sanitizers.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/sanitizers.yml"]

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: pip install cmake==4.4.0 ninja==1.13.0

      # ubsan is built with -fno-sanitize-recover, so any report fails the test
      - name: Build the Catch2 tests with ASan and UBSan
        working-directory: engine
        run: |
          cmake -S . -B build/sanitize -G Ninja -DQUANTLY_BUILD_TESTS=ON -DQUANTLY_SANITIZE=ON
          cmake --build build/sanitize

      - name: Run them
        working-directory: engine
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitize --output-on-failure
