name: e2e

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "engine/**"
      - "e2e/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # postgres, redis and the s3 stand-in. the worker joins after the market data is seeded.
      - name: Start backing services
        run: docker compose up -d --wait postgres redis s3

      - name: Install backend dependencies
        run: pip install -r backend/requirements/dev.txt

      - name: Migrate and seed synthetic prices
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          alembic upgrade head
          python ../e2e/seed_market.py

      - name: Start the worker
        run: docker compose up -d --build worker

      - name: Start the api
        working-directory: backend
        run: |
          nohup uvicorn api.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          cat ../api.log
          exit 1

      - name: Install frontend and e2e dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      # playwright starts the vite dev server itself
      - name: Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Service logs
        if: failure()
        run: |
          docker compose logs worker --tail 200
          cat api.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
