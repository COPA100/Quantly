name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # oidc token, exchanged for short-lived aws credentials
  contents: read

# one deploy at a time. a newer push queues behind the running one instead of
# racing it for the state lock.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.0"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: dev

jobs:
  # the stack costs money by the hour, so it is not rebuilt on every push.
  # DEPLOY_ENABLED is the demo switch: flip it on for a demo window and pushes
  # to main deploy, flip it off (and destroy) and this whole workflow skips.
  repos:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$ENVIRONMENT.tfstate" \
            -backend-config="region=$AWS_REGION"

      # the services cannot start until their images exist, so on a fresh
      # stack the repositories go up before anything else. a no-op afterwards.
      - name: Create the ECR repositories
        run: |
          terraform apply -input=false -auto-approve \
            -var-file="environments/$ENVIRONMENT.tfvars" -target=module.ecr

  images:
    needs: repos
    uses: ./.github/workflows/images.yml
    with:
      push: true

  apply:
    needs: images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # the wrapper decorates stdout, which breaks `terraform output -raw`
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=$ENVIRONMENT.tfstate" \
            -backend-config="region=$AWS_REGION"

      # deploying is just an apply: the sha tag changes the task definitions,
      # and ecs rolls both services onto the new images
      - name: terraform apply
        run: |
          terraform apply -input=false -auto-approve \
            -var-file="environments/$ENVIRONMENT.tfvars" \
            -var "image_tag=${{ github.sha }}"

      # rds has no public ip, so migrations run as a one-off task inside the
      # vpc: the new api task definition with its command overridden
      - name: Run database migrations
        run: |
          cluster=$(terraform output -raw ecs_cluster_name)
          container=$(terraform output -raw api_service_name)
          subnets=$(terraform output -json public_subnet_ids | jq -r 'join(",")')
          security_group=$(terraform output -raw api_security_group_id)

          task=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$(terraform output -raw api_task_definition_arn)" \
            --capacity-provider-strategy capacityProvider=FARGATE,weight=1 \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=ENABLED}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$container\",\"command\":[\"alembic\",\"upgrade\",\"head\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"

          code=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$code" != "0" ]; then
            echo "::error::migration task exited with $code, see the api log group"
            exit 1
          fi

      # terraform returns as soon as the rollout starts. wait for it to finish,
      # the circuit breaker rolls a bad one back and this step then fails.
      - name: Wait for the services to settle
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw api_service_name)" "$(terraform output -raw worker_service_name)"

      - name: Smoke test
        run: |
          api_url=$(terraform output -raw api_url)
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$api_url/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$api_url/health/db"
          echo "deployed \`${{ github.sha }}\` to $api_url" >> "$GITHUB_STEP_SUMMARY"
